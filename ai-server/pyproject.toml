[project]
name = "ai-server"
version = "0.1.0"
description = "FastAPI + LangChain + Redis 命理对话服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "redis>=7.4.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["app", "tests", "main.py"]
extraPaths = ["."]
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
files = ["app", "main.py", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "langchain.*", "langchain_community.*", "langchain_core.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
