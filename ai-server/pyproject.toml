[project]
name = "ai-server"
version = "0.1.0"
description = "FastAPI + LangChain + Redis 命理对话服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.8.2",
    "aiofiles>=25.1.0",
    "aiomysql>=0.3.2",
    "asyncmy>=0.2.11",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.1",
    "greenlet>=3.4.0",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.0",
    "passlib>=1.7.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "tomlkit>=0.15.0",
    "tortoise-orm>=1.1.7",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
packages = ["app", "demo"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["app", "demo", "tests", "main.py"]
extraPaths = ["."]
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
files = ["app", "main.py", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "langchain.*",
    "langchain_community.*",
    "langchain_core.*",
    "uvicorn.*",
    "jose.*",
    "passlib.*",
    "yaml.*",
    "tortoise.*",
    "aerich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
# PyPI aerich caps tortoise-orm<1.0; dev branch supports tortoise 1.x.
aerich = { git = "https://github.com/tortoise/aerich", branch = "dev" }

[tool.uv]
# Allow resolving aerich git source alongside tortoise-orm 1.x.
override-dependencies = ["aerich"]

[tool.aerich]
tortoise_orm = "app.db.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest-asyncio>=1.3.0"]
